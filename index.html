<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para YARLYN SANDRA - San Valentín</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            font-family: 'Arial', sans-serif;
        }

        /* Título principal */
        .titulo-superior {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            color: #ff69b4;
            text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff69b4;
            text-align: center;
            z-index: 10;
        }
        .titulo-superior h1 { font-size: 2rem; }
        .titulo-superior h2 { font-size: 2.5rem; margin-top: 1rem; }

        /* Anillos centrales */
        .anillos {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        .anillo {
            position: absolute;
            border: 4px solid #ff69b4;
            border-radius: 50%;
            box-shadow: 0 0 25px #ff69b4, 0 0 50px #ff69b4;
        }
        .anillo1 { width: 200px; height: 200px; animation: girar 8s linear infinite; }
        .anillo2 { width: 150px; height: 150px; top: 25px; left: 25px; animation: girar 6s reverse linear infinite; }

        /* Elementos flotantes */
        .elemento-flotante {
            position: absolute;
            z-index: 3;
            animation: flotar 20s linear infinite;
        }
        .kitty-icono {
            font-size: 2rem;
            color: #ff69b4;
            text-shadow: 0 0 10px #ff69b4;
        }
        .texto-romantico {
            color: #ffc0cb;
            font-size: 1rem;
            text-shadow: 0 0 10px #ff69b4;
            transform: rotate(var(--rot, 0deg));
        }
        .lazo-icono {
            font-size: 1.5rem;
            color: #ff69b4;
            text-shadow: 0 0 10px #ff69b4;
        }

        /* Botón de música */
        .btn-musica {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 1.5rem;
            background: #ff69b4;
            color: #fff;
            border: none;
            border-radius: 25px;
            box-shadow: 0 0 15px #ff69b4;
            cursor: pointer;
            z-index: 10;
        }

        /* Animaciones */
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes flotar {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(30deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="titulo-superior">
        <h1>FELIZ DÍA DEL AMOR</h1>
        <h2>YARLYN SANDRA</h2>
    </div>

    <div class="anillos">
        <div class="anillo anillo1"></div>
        <div class="anillo anillo2"></div>
    </div>

    <button class="btn-musica" id="btnMusica">Pausar Música</button>
    <audio id="musica" loop autoplay>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_0d505081a5.mp3?filename=romantic-piano-100-bpm-121996.mp3" type="audio/mpeg">
    

    <script>
        // Control de música
        const musica = document.getElementById('musica');
        const btnMusica = document.getElementById('btnMusica');
        btnMusica.addEventListener('click', () => {
            if(musica.paused) {
                musica.play();
                btnMusica.textContent = "Pausar Música";
            } else {
                musica.pause();
                btnMusica.textContent = "Reproducir Música";
            }
        });

        // Crear elementos flotantes (Hello Kitty, textos y lazos)
        const elementos = ["🎀", "Te amo hoy y siempre", "🎀", "Mi amor eterno", "🎀", "Para siempre juntos", "🎀", "Eres mi todo"];
        function crearElemento() {
            const elem = document.createElement('div');
            elem.classList.add('elemento-flotante');
            
            const tipo = Math.floor(Math.random()*3);
            if(tipo === 0) {
                elem.classList.add('kitty-icono');
                elem.textContent = "🎀";
            } else if(tipo === 1) {
                elem.classList.add('texto-romantico');
                elem.textContent = elementos[Math.floor(Math.random()*elementos.length)];
                elem.style.setProperty('--rot', `${Math.random()*40 - 20}deg`);
            } else {
                elem.classList.add('lazo-icono');
                elem.textContent = "🎀";
            }

            elem.style.left = `${Math.random()*100}%`;
            elem.style.animationDuration = `${Math.random()*20 + 10}s`;
            document.body.appendChild(elem);
            
            setTimeout(() => elem.remove(), 30000);
        }

        setInterval(crearElemento, 1500);
    </script>
</body>
</html>
